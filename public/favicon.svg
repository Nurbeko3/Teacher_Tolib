<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Teacher Tolib</title>
  <desc id="desc">Teacher Tolib ta'lim platformasi monogrammasi</desc>

  <defs>
    <linearGradient id="background" x1="10" y1="7" x2="55" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7F1D1D"/>
      <stop offset=".48" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="book" x1="17" y1="42" x2="47" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#450A0A" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Brend rangidagi kuchli, mobil ikonaga mos siluet -->
  <rect width="64" height="64" rx="16" fill="url(#background)"/>
  <path d="M13 3h24C48.6 3 58 12.4 58 24v14c-8.2-17.5-22.4-27.8-45-35Z" fill="#FFF" opacity=".08"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#FFF" stroke-opacity=".18" stroke-width="3"/>

  <g filter="url(#shadow)">
    <!-- Bitiruv qalpog'i T harfining yuqori qismi vazifasini bajaradi -->
    <path d="m13 20 19-8 19 8-19 8-19-8Z" fill="#FFF"/>
    <path d="M21 24.6v5.2c0 3.2 4.9 5.8 11 5.8s11-2.6 11-5.8v-5.2L32 29l-11-4.4Z" fill="#FEE2E2"/>
    <path d="M49.5 21v9.2" fill="none" stroke="#FFF" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="49.5" cy="32.5" r="2.4" fill="#FDE68A"/>

    <!-- Aniq T monogramma -->
    <path d="M27.8 27.5h8.4v18.2h-8.4V27.5Z" fill="#FFF"/>

    <!-- Bilimni ifodalovchi ochiq kitob -->
    <path d="M15 41.2c6.8-1.4 12.4.1 17 4.1 4.6-4 10.2-5.5 17-4.1v10.2c-6.7-1.2-12.3.2-17 4.1-4.7-3.9-10.3-5.3-17-4.1V41.2Z" fill="url(#book)"/>
    <path d="M32 45.3v10.2" fill="none" stroke="#FCA5A5" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M18.7 45.1c4.1-.2 7.4.7 10.1 2.7M45.3 45.1c-4.1-.2-7.4.7-10.1 2.7" fill="none" stroke="#FECACA" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
